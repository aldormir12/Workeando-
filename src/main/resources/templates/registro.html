<!DOCTYPE html>
<html
  lang="es"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
    <title>Registro de Usuario</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
  </head>
  <body th:attr="data-registro-exitoso=${registroExitoso ?: false}">
    <div class="container mt-5" style="max-width: 500px">
      <h2 class="text-center mb-4">Registrarse en Workeando</h2>

      <form
        th:action="@{/usuarios/registro}"
        method="post"
        th:object="${usuario}"
        class="mt-4"
      >
        <!-- Nombre -->
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre completo</label>
          <input
            type="text"
            class="form-control"
            th:field="*{nombre}"
            required
          />
          <div
            class="text-danger"
            th:if="${#fields.hasErrors('nombre')}"
            th:errors="*{nombre}"
          ></div>
        </div>

        <!-- Correo -->
        <div class="mb-3">
          <label for="correo" class="form-label">Correo electrónico</label>
          <input
            type="email"
            class="form-control"
            th:field="*{correo}"
            required
          />
          <div
            class="text-danger"
            th:if="${#fields.hasErrors('correo')}"
            th:errors="*{correo}"
          ></div>
        </div>

        <!-- Contraseña -->
        <div class="mb-3">
          <label for="contrasena" class="form-label">Contraseña</label>
          <input
            type="password"
            class="form-control"
            th:field="*{contrasena}"
            required
          />
          <div
            class="text-danger"
            th:if="${#fields.hasErrors('contrasena')}"
            th:errors="*{contrasena}"
          >
            Error en contraseña
          </div>
        </div>

        <!-- Rol -->
        <div class="mb-3">
          <label for="rol" class="form-label">Rol</label>
          <select class="form-select" th:field="*{rol}" required>
            <option value="">Seleccione un rol</option>
            <option
              th:each="r : ${roles}"
              th:value="${r}"
              th:text="${r}"
            ></option>
          </select>
          <div
            class="text-danger"
            th:if="${#fields.hasErrors('rol')}"
            th:errors="*{rol}"
          ></div>
        </div>

        <button type="submit" class="btn btn-primary w-100">Registrarse</button>
      </form>

      <div class="mt-4 text-center">
        ¿Ya tienes una cuenta? <a th:href="@{/login}">Inicia sesión</a>
      </div>
    </div>
    <div
      class="modal fade"
      id="registroExitoModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4 shadow-lg">
          <div class="modal-header bg-primary text-white">
            <h5 class="modal-title">¡Registro exitoso!</h5>
          </div>
          <div class="modal-body text-center">
            <p class="fs-5">Tu cuenta ha sido creada correctamente.</p>
            <button type="button" class="btn btn-success px-4" id="btnIrALogin">
              Iniciar sesión
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const exito = document.body.dataset.registroExitoso;

        
        if (exito === "true") {
          const modal = new bootstrap.Modal(
            document.getElementById("registroExitoModal")
          );
          modal.show();
        }

        // Botón para ir a login
        const btnIrALogin = document.getElementById("btnIrALogin");
        if (btnIrALogin) {
          btnIrALogin.addEventListener("click", () => {
            window.location.href = "/login";
          });
        }
      });
    </script>
  </body>
</html>
