<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Probador de Chat (Postulación)</title>

    <!-- SockJS y STOMP -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <!-- Tu script del chat -->
    <script src="/js/chat-socket.js"></script>

    <style>
      body {
        font-family: system-ui, Arial, sans-serif;
        margin: 20px;
      }
      .row {
        margin-bottom: 10px;
      }
      input,
      button {
        padding: 8px;
      }
      #log {
        border: 1px solid #ccc;
        padding: 10px;
        height: 220px;
        overflow-y: auto;
        background: #fafafa;
      }
      label {
        display: inline-block;
        width: 180px;
      }
    </style>
  </head>
  <body>
    <h1>Probador de Chat (por Postulación)</h1>
    <p>
      Prueba el chat en tiempo real usando el
      <strong>id de la postulación</strong>.
    </p>

    <div class="row">
      <label>Mi usuarioId:</label>
      <input id="miUsuarioId" type="number" placeholder="Ej: 12" />
    </div>
    <div class="row">
      <label>Mi nombre a mostrar:</label>
      <input id="miNombre" type="text" placeholder="Ej: Juan Pérez" />
    </div>
    <div class="row">
      <label>Postulación Id:</label>
      <input id="postulacionId" type="number" placeholder="Ej: 34" />
    </div>
    <div class="row">
      <label>Destinatario usuarioId:</label>
      <input id="destinatarioId" type="number" placeholder="Ej: 33" />
    </div>

    <div class="row">
      <button id="btnConectar">Conectar</button>
      <button id="btnDesconectar">Desconectar</button>
    </div>

    <div class="row">
      <label>Mensaje:</label>
      <input
        id="texto"
        type="text"
        placeholder="Escribe aquí"
        style="width: 320px"
      />
      <button id="btnEnviar">Enviar</button>
    </div>

    <h3>Mensajes</h3>
    <div id="log"></div>

    <script>
      function logLinea(txt) {
        var box = document.getElementById("log");
        var p = document.createElement("div");
        p.textContent = txt;
        box.appendChild(p);
        box.scrollTop = box.scrollHeight;
      }

      document
        .getElementById("btnConectar")
        .addEventListener("click", function () {
          var miUsuarioId = parseInt(
            document.getElementById("miUsuarioId").value,
            10
          );
          if (isNaN(miUsuarioId)) {
            alert("Ingresa tu usuarioId.");
            return;
          }
          initChatSocket({
            usuarioId: miUsuarioId,
            onMessage: function (dto) {
              var quien = dto.remitenteNombre
                ? dto.remitenteNombre
                : "Usuario " + dto.remitenteId;
              logLinea("[" + quien + "] " + dto.contenido);
            },
          });
          logLinea("Conectado a /queue/chat/" + miUsuarioId);
        });

      document
        .getElementById("btnDesconectar")
        .addEventListener("click", function () {
          disconnectChatSocket();
          logLinea("Desconectado");
        });

      document
        .getElementById("btnEnviar")
        .addEventListener("click", function () {
          var postulacionId = parseInt(
            document.getElementById("postulacionId").value,
            10
          );
          var destinatarioId = parseInt(
            document.getElementById("destinatarioId").value,
            10
          );
          var remitenteId = parseInt(
            document.getElementById("miUsuarioId").value,
            10
          );
          var remitenteNombre = document.getElementById("miNombre").value || "";
          var contenido = document.getElementById("texto").value;

          if (
            isNaN(postulacionId) ||
            isNaN(destinatarioId) ||
            isNaN(remitenteId)
          ) {
            alert("Verifica postulacionId, destinatarioId y miUsuarioId.");
            return;
          }
          sendChatMessage({
            postulacionId: postulacionId,
            remitenteId: remitenteId,
            remitenteNombre: remitenteNombre,
            destinatarioId: destinatarioId,
            contenido: contenido,
          });
          document.getElementById("texto").value = "";
        });
    </script>
  </body>
</html>
