<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Mis Postulaciones</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container mt-5 bg-white p-4 rounded shadow-sm">
    <h2 class="mb-4 text-center">Mis Postulaciones</h2>

    <table class="table table-bordered table-hover">
      <thead class="table-dark">
        <tr>
          <th>Proyecto <i class="fas fa-project-diagram ms-2"></i></th>
          <th>Descripción <i class="fas fa-info-circle ms-2"></i></th>
          <th>Estado <i class="fas fa-clipboard-check ms-2"></i></th>
          <th>Fecha de Postulación <i class="fas fa-calendar-day ms-2"></i></th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="postulacion : ${postulaciones}">
          <td th:text="${postulacion.proyecto.titulo}">Nombre del Proyecto</td>
          <td th:text="${postulacion.proyecto.descripcion}">Descripción del Proyecto</td>
          
          <!-- Estado con colores Bootstrap -->
          <td>
            <span 
              th:class="${postulacion.estado == 'Aceptada' ? 'badge bg-success' : 
                        postulacion.estado == 'Rechazada' ? 'badge bg-danger' : 'badge bg-warning'}" 
              th:text="${postulacion.estado}">Estado</span>
          </td> 

          <td th:text="${postulacion.fechaPostulacion}">Fecha</td>
        </tr>
      </tbody>
    </table>

    <!-- Mensaje cuando no hay postulaciones -->
    <div th:if="${postulaciones.empty}" class="alert alert-info text-center">
      Aún no has realizado ninguna postulación.
    </div>

    <a href="/free" class="btn btn-secondary mt-3">← Volver</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
