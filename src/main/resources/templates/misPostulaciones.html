<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Mis Postulaciones</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/postulaciones.css}" />
  </head>

  <body class="bg-light">
    <div class="container mt-5 bg-white p-4 rounded shadow-sm">
      <h2 class="mb-4 text-center">Mis Postulaciones</h2>

      <table class="table table-bordered table-hover">
        <thead class="table-dark">
          <tr>
            <th>Proyecto <i class="fas fa-project-diagram ms-2"></i></th>
            <th>Descripción <i class="fas fa-info-circle ms-2"></i></th>
            <th>Estado <i class="fas fa-clipboard-check ms-2"></i></th>
            <th>Progreso</th>
            <th>
              Fecha de Postulación <i class="fas fa-calendar-day ms-2"></i>
            </th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="postulacion : ${postulaciones}">
            <td th:text="${postulacion.proyecto.titulo}">
              Nombre del Proyecto
            </td>

            <td>
              <span
                class="descripcion-corta"
                th:text="${postulacion.proyecto.descripcion}"
                >Descripción del Proyecto</span
              >
              <button
                type="button"
                class="btn btn-link p-0 ms-2 ver-mas"
                style="font-size: 0.9rem"
              >
                Ver más
              </button>
            </td>

            <td>
              <span
                th:class="${postulacion.estado == 'Aceptada' ? 'badge bg-success' :
                       postulacion.estado == 'Rechazada' ? 'badge bg-danger' : 'badge bg-warning'}"
                th:text="${postulacion.estado}"
                >Estado</span
              >
            </td>

            <!-- Progreso con anillo de 4 fases -->
            <td
              th:with="
    ep=${postulacion.proyecto.estadoProyecto != null ? postulacion.proyecto.estadoProyecto.name() : 'PUBLICADO'},
    cv=${postulacion.cvVisto != null ? postulacion.cvVisto : false},
    fin=${postulacion.finalista != null ? postulacion.finalista : (postulacion.estado != null && postulacion.estado.equals('Aceptada'))},
    hasCtr=${false},
    step=${ hasCtr ? 4 : (fin ? 3 : (cv ? 2 : 1)) }
  "
            >
              <div class="fases">
                <span class="ring" th:classappend="${' s' + step}"></span>
                <div class="fases-list">
                  <div class="fase">
                    <span class="dot done"></span><span>Postulado</span>
                  </div>
                  <div class="fase">
                    <span
                      class="dot"
                      th:classappend="${cv ? ' done' : ''}"
                    ></span>
                    <span>CV visto</span>
                  </div>
                  <div class="fase">
                    <span
                      class="dot"
                      th:classappend="${fin ? ' done' : ''}"
                    ></span>
                    <span>Finalista</span>
                  </div>
                  <div class="fase">
                    <span
                      class="dot"
                      th:classappend="${hasCtr ? ' done' : ''}"
                    ></span>
                    <span
                      th:text="${ep == 'FINALIZADO' ? 'Finalizado' : 'En progreso'}"
                    ></span>
                  </div>
                </div>

                <span th:if="${ep == 'FINALIZADO'}" class="badge-soft success"
                  >Finalizado</span
                >
                <span th:if="${ep == 'CANCELADO'}" class="badge-soft secondary"
                  >Cancelado</span
                >
              </div>
            </td>

            <td th:text="${postulacion.fechaPostulacion}">Fecha</td>
          </tr>
        </tbody>
      </table>

      <div th:if="${postulaciones.empty}" class="alert alert-info text-center">
        Aún no has realizado ninguna postulación.
      </div>

      <a href="/free" class="btn btn-secondary mt-3">← Volver</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const limite = 80;
        document.querySelectorAll(".descripcion-corta").forEach((el) => {
          const textoCompleto = el.textContent.trim();
          if (textoCompleto.length > limite) {
            const textoCorto = textoCompleto.substring(0, limite) + "...";
            el.textContent = textoCorto;
            const btn = el.nextElementSibling;
            let expandido = false;
            btn.addEventListener("click", () => {
              expandido = !expandido;
              el.textContent = expandido ? textoCompleto : textoCorto;
              btn.textContent = expandido ? "Ver menos" : "Ver más";
            });
          } else {
            el.nextElementSibling.style.display = "none";
          }
        });
      });
    </script>
  </body>
</html>
