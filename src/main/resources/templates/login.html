<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Iniciar sesión - Workeando</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="container mt-5" style="max-width: 450px">
      <div class="card shadow-sm p-4">
        <h2 class="text-center mb-4">Iniciar sesión</h2>

        <form th:action="@{/login}" method="post">
          <div class="mb-3">
            <label class="form-label">Correo electrónico</label>
            <input
              type="email"
              name="username"
              class="form-control"
              placeholder="Ingresa tu correo"
              required
            />
          </div>
          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input
              type="password"
              name="password"
              class="form-control"
              placeholder="••••••"
              required
            />
          </div>

          <button type="submit" class="btn btn-primary w-100">Entrar</button>

          <!-- Mostrar error si login falló -->
          <div th:if="${param.error}" class="alert alert-danger mt-3">
            Correo o contraseña incorrectos
          </div>
        </form>

        <hr class="my-4" />

        <div class="text-center mb-2">O inicia sesión con:</div>

        <div class="d-grid gap-2">
          <a href="#" class="btn btn-outline-danger">
            <i class="fab fa-google me-2"></i> Iniciar con Google
          </a>
          <a href="#" class="btn btn-outline-primary">
            <i class="fab fa-facebook-f me-2"></i> Iniciar con Facebook
          </a>
          <a href="#" class="btn btn-outline-dark">
            <i class="fab fa-linkedin-in me-2"></i> Iniciar con LinkedIn
          </a>
        </div>

        <div class="text-center mt-4">
          ¿No tienes cuenta?
          <a th:href="@{/usuarios/registro}">Regístrate aquí</a>
        </div>
      </div>
    </div>
  </body>
</html>
