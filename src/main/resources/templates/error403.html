<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Acceso Denegado | Error 403</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="container text-center">
        <div class="card shadow p-4 border-danger" style="max-width: 500px; margin: auto;">
            <div class="card-body">
                <h1 class="display-3 text-danger fw-bold">403</h1>
                <p class="fs-5 text-secondary mb-4">¡Ups! No tienes permiso para acceder a esta página.</p>
                <a th:href="@{${panelUrl}}" class="btn btn-danger">Volver al inicio</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS (opcional, solo si usarás componentes interactivos) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
